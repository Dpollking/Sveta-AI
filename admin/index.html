<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Sveta AI — Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <h1>Sveta AI — Admin Panel</h1>
    <div class="token-box">
      <input id="token" type="password" placeholder="admin token">
      <button id="saveToken">Войти</button>
    </div>
  </header>

  <main id="app" class="hidden">
    <section id="dashboard" class="card">
      <h2>Dashboard</h2>
      <div class="stats" id="stats"></div>
      <h3>Частота red flags</h3>
      <table id="flagTable"><tbody></tbody></table>
    </section>

    <section class="card">
      <h2>Sessions</h2>
      <table id="sessionsTable">
        <thead>
          <tr><th>ID</th><th>День</th><th>Стадия</th><th>Trust</th><th>Attraction</th><th>Suspicion</th><th>Risk</th><th>Обновлено</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Session detail</h2>
      <div id="detail">Выберите сессию выше.</div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
